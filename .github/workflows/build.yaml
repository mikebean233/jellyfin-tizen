name: Build

# Builds Jellyfin.wgt from samsung-friendly-jellyfin-web, signed with the Tizen SDK
# image's default certificate (scripts/package.sh). v* tags attach it to a release.

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      web_ref:
        description: samsung-friendly-jellyfin-web branch, tag or commit to build
        required: false

env:
  WEB_REPO: mikebean233/samsung-friendly-jellyfin-web
  # Keep this on the branch that matches your server's version
  WEB_REF: release-12.4

permissions:
  contents: write

# Releases from master take the next version number, so they run one at a time
concurrency:
  group: ${{ github.ref == 'refs/heads/master' && github.event_name == 'push' && 'release' || github.run_id }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # tags, for the next version

      - uses: actions/checkout@v7
        with:
          repository: ${{ env.WEB_REPO }}
          ref: ${{ inputs.web_ref || env.WEB_REF }}
          path: jellyfin-web

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            jellyfin-web/package-lock.json

      - name: Build jellyfin-web
        working-directory: jellyfin-web
        run: |
          npm ci --no-audit
          USE_SYSTEM_FONTS=1 npm run build:production

      - name: Build www
        run: JELLYFIN_WEB_DIR=jellyfin-web/dist npm ci --no-audit

      - name: Version
        id: version
        run: |
          # Tizen app versions are x.y.z with x, y <= 255 and z <= 65535
          file=$(grep -o '<widget [^>]*' config.xml | sed -n 's/.* version="\([^"]*\)".*/\1/p')
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            tag="$GITHUB_REF_NAME"; version="${tag#v}"   # a tag pushed by hand
            release=true
          elif [[ "$GITHUB_REF" == refs/heads/master && "$GITHUB_EVENT_NAME" == push ]]; then
            # every push to master is released as the next version: the latest tag's patch
            # + 1, or config.xml's version when that's higher (to bump minor or major)
            latest=$(git tag -l 'v*' | sed 's/^v//' | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -1)
            latest=${latest:-0.0.0}
            bumped="${latest%.*}.$(( ${latest##*.} + 1 ))"
            version=$(printf '%s\n' "$bumped" "$file" | sort -V | tail -1)
            git rev-parse -q --verify "refs/tags/v$version" >/dev/null && { echo "v$version already exists" >&2; exit 1; }
            tag="v$version"
            release=true
          else
            # builds that aren't released
            tag="$GITHUB_REF_NAME"; version="0.1.$GITHUB_RUN_NUMBER"
            release=false
          fi
          echo "Version $version (tag $tag, release: $release)"
          {
            echo "version=$version"
            echo "tag=$tag"
            echo "release=$release"
          } >> "$GITHUB_OUTPUT"

      - name: Package
        id: package
        env:
          VERSION: ${{ steps.version.outputs.version }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          scripts/package.sh "$VERSION" build/Jellyfin.wgt
          web_sha=$(git -C jellyfin-web rev-parse --short HEAD)
          echo "name=Jellyfin-${TAG//\//-}-web-${web_sha}" >> "$GITHUB_OUTPUT"
          {
            echo "App version $VERSION, web \`$WEB_REPO@$(git -C jellyfin-web rev-parse HEAD)\`"
            echo
            echo "Install on a TV in Developer Mode:"
            echo
            echo '```sh'
            echo "docker run --rm --platform linux/amd64 -e GITHUB_REPO=$GITHUB_REPOSITORY -e WGT_FILE=Jellyfin -e RELEASE_TAG=$TAG ghcr.io/gardner/install-wgt-tizen <TV IP>"
            echo '```'
          } > notes.md

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.package.outputs.name }}
          path: build/Jellyfin.wgt

      - name: Release
        # creates the tag too when it doesn't exist yet (pushes to master)
        if: steps.version.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: gh release create "$TAG" build/Jellyfin.wgt --target "$GITHUB_SHA" --title "$TAG" --notes-file notes.md

name: Build

# Builds Jellyfin.wgt from samsung-friendly-jellyfin-web, signed with the Tizen SDK
# image's default certificate (scripts/package.sh). v* tags attach it to a release.

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      web_ref:
        description: samsung-friendly-jellyfin-web branch, tag or commit to build
        required: false

env:
  WEB_REPO: mikebean233/samsung-friendly-jellyfin-web
  # Keep this on the branch that matches your server's version
  WEB_REF: release-12.4

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/checkout@v7
        with:
          repository: ${{ env.WEB_REPO }}
          ref: ${{ inputs.web_ref || env.WEB_REF }}
          path: jellyfin-web

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            jellyfin-web/package-lock.json

      - name: Build jellyfin-web
        working-directory: jellyfin-web
        run: |
          npm ci --no-audit
          USE_SYSTEM_FONTS=1 npm run build:production

      - name: Build www
        run: JELLYFIN_WEB_DIR=jellyfin-web/dist npm ci --no-audit

      - name: Package
        id: package
        run: |
          # Tags are vX.Y.Z; other builds get 0.1.<run number>
          if [[ $GITHUB_REF == refs/tags/v* ]]; then version=${GITHUB_REF_NAME#v}; else version=0.1.$GITHUB_RUN_NUMBER; fi
          scripts/package.sh "$version" build/Jellyfin.wgt
          web_sha=$(git -C jellyfin-web rev-parse --short HEAD)
          echo "name=Jellyfin-${GITHUB_REF_NAME//\//-}-web-${web_sha}" >> "$GITHUB_OUTPUT"
          {
            echo "App version $version, web \`$WEB_REPO@$(git -C jellyfin-web rev-parse HEAD)\`"
            echo
            echo "Install on a TV in Developer Mode:"
            echo
            echo '```sh'
            echo "docker run --rm --platform linux/amd64 -e GITHUB_REPO=$GITHUB_REPOSITORY -e WGT_FILE=Jellyfin -e RELEASE_TAG=$GITHUB_REF_NAME ghcr.io/gardner/install-wgt-tizen <TV IP>"
            echo '```'
          } > notes.md

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.package.outputs.name }}
          path: build/Jellyfin.wgt

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" build/Jellyfin.wgt --title "$GITHUB_REF_NAME" --notes-file notes.md
